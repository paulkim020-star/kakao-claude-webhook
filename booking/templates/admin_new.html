{% extends "base.html" %}
{% block content %}
  <div class="card">
    <h2>수기 예약 입력 <span class="muted">(전화 예약 등)</span></h2>
    <form method="get" action="/admin/new">
      <label>시술</label>
      <select name="service_id" onchange="this.form.submit()">
        <option value="0">선택하세요</option>
        {% for s in services %}
        <option value="{{ s['id'] }}" {% if service and service['id'] == s['id'] %}selected{% endif %}>
          {{ s['name'] }} ({{ s['duration_min'] }}분)</option>
        {% endfor %}
      </select>
      <label>날짜</label>
      <input type="date" name="date" value="{{ date }}" onchange="this.form.submit()">
    </form>
  </div>
  {% if service %}
  <div class="card">
    {% if slots %}
    <form method="post" action="/admin/new">
      <input type="hidden" name="service_id" value="{{ service['id'] }}">
      <input type="hidden" name="date" value="{{ date }}">
      <label>시간</label>
      <select name="time">
        {% for t in slots %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
      </select>
      <label>이름</label>
      <input type="text" name="customer_name" required maxlength="30">
      <label>휴대폰 번호</label>
      <input type="tel" name="phone" required>
      <label>요청사항 (선택)</label>
      <input type="text" name="request_note" maxlength="300">
      <div style="margin-top:14px"><button class="btn" type="submit">예약 등록</button></div>
    </form>
    {% else %}
    <p class="muted">이 날짜에는 예약 가능한 시간이 없습니다.</p>
    {% endif %}
  </div>
  {% endif %}
  <a class="btn secondary" href="/admin?date={{ date }}">← 예약 현황으로</a>
{% endblock %}

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ shop_name }} 예약</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         background: #f5f5f7; color: #222; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
  header { padding: 20px 0 4px; }
  header h1 { font-size: 20px; }
  header h1 a { color: inherit; text-decoration: none; }
  header p { color: #777; font-size: 13px; margin-top: 4px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-top: 12px;
          box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .card h2 { font-size: 16px; margin-bottom: 8px; }
  .muted { color: #777; font-size: 13px; }
  .price { font-weight: 700; }
  .notice { background: #fff8e6; border-radius: 8px; padding: 10px 12px;
            font-size: 13px; color: #7a5c00; margin-top: 12px; }
  .btn { display: block; width: 100%; text-align: center; padding: 13px;
         border-radius: 10px; border: 0; font-size: 15px; font-weight: 600;
         background: #191919; color: #fff; text-decoration: none; cursor: pointer; }
  .btn.secondary { background: #fff; color: #191919; border: 1px solid #ccc; }
  .btn + .btn { margin-top: 8px; }
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .slots a, .slots button { display: block; width: 100%; text-align: center;
         padding: 10px 0; border-radius: 8px; border: 1px solid #ccc;
         background: #fff; color: #191919; font-size: 14px;
         text-decoration: none; cursor: pointer; }
  label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
  input[type=text], input[type=tel], input[type=date], textarea, select {
         width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 8px;
         font-size: 15px; background: #fff; }
  .error { background: #fdecec; color: #b3261e; border-radius: 8px;
           padding: 10px 12px; font-size: 13px; margin-top: 12px; }
  .success { background: #e8f5e9; color: #1b5e20; border-radius: 8px;
             padding: 10px 12px; font-size: 13px; margin-top: 12px; }
  .row { display: flex; justify-content: space-between; padding: 6px 0;
         font-size: 14px; border-bottom: 1px solid #f0f0f0; }
  .row:last-child { border-bottom: 0; }
  .row .k { color: #777; }
  .code { font-size: 26px; font-weight: 800; letter-spacing: 3px; text-align: center;
          padding: 10px 0; }
  footer { padding: 20px 0; text-align: center; }
  footer a { color: #777; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="/booking">{{ shop_name }}</a></h1>
    <p>1인샵 · 100% 예약제</p>
  </header>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% if message %}<div class="success">{{ message }}</div>{% endif %}
  {% block content %}{% endblock %}
  <footer><a href="/booking/lookup">내 예약 조회 · 변경 · 취소</a></footer>
</div>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동화책 만들기</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         color: #4a4238; background: #fef6ec;
         background-image: radial-gradient(#f6e3cc 1.5px, transparent 1.5px);
         background-size: 26px 26px; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px; }
  header { text-align: center; padding: 26px 18px 20px; }
  header h1 { font-size: 27px; color: #b56a3a; letter-spacing: .5px; }
  header h1 a { color: inherit; text-decoration: none; }
  header p { color: #b79877; font-size: 13px; margin-top: 6px; }

  .card { background: #fffaf2; border: 1px solid #f0dcc2; border-radius: 16px;
          padding: 20px; margin-top: 16px;
          box-shadow: 0 3px 12px rgba(150, 110, 60, .1); }
  h2 { font-size: 18px; color: #7a5230; margin-bottom: 10px; }
  .muted { color: #a7906f; font-size: 13px; line-height: 1.6; }

  label { display: block; font-size: 13px; color: #8a6a44; font-weight: 700;
          margin: 14px 0 6px; }
  input[type=text], input[type=number] {
          width: 100%; padding: 12px; border: 1.5px solid #ecd9bf;
          border-radius: 12px; font-size: 15px; background: #fffdf9; color: #4a4238; }
  input:focus { outline: none; border-color: #e08a4c; }

  .btn { display: block; width: 100%; text-align: center; padding: 14px;
         border: 0; border-radius: 14px; font-size: 16px; font-weight: 700;
         background: #e08a4c; color: #fff; text-decoration: none; cursor: pointer;
         margin-top: 18px; box-shadow: 0 3px 10px rgba(224, 138, 76, .3); }
  .btn:hover { background: #cc7638; }

  .error { background: #fbeae4; color: #a5462c; border: 1px dashed #e3b0a0;
           border-radius: 12px; padding: 12px 14px; font-size: 13px; margin-top: 14px; }

  .book-link { display: block; padding: 13px 16px; margin-top: 10px;
               border-radius: 12px; border: 1px solid #f0dcc2; background: #fffaf2;
               text-decoration: none; color: #6a4a2a; }
  .book-link:hover { border-color: #e08a4c; }
  .book-link .when { color: #a7906f; font-size: 12px; }

  .page-card { background: #fffaf2; border: 1px solid #f0dcc2; border-radius: 16px;
               padding: 14px; margin-top: 18px;
               box-shadow: 0 3px 12px rgba(150, 110, 60, .1); }
  .page-card img { width: 100%; border-radius: 12px; display: block; }
  .page-card .text { font-size: 16px; line-height: 1.8; color: #4a4238;
                     margin-top: 14px; }
  .page-no { font-size: 12px; color: #b79877; font-weight: 700; }

  footer { padding: 26px 0; text-align: center; }
  footer a { color: #a7906f; font-size: 13px; font-weight: 600;
             text-decoration: none; border-bottom: 1px dashed #d8bf9d; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="/storybook">📖 동화책 만들기</a></h1>
    <p>주제만 정하면 작가와 화가가 그림 동화를 만들어 드려요</p>
  </header>
  {% block content %}{% endblock %}
  <footer><a href="/storybook">새 동화책 만들기</a></footer>
</div>
</body>
</html>

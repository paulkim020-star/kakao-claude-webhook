<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>채보 결과 · music-sheet-transcriber</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.4rem; }
    .error { background: #ffebee; border: 1px solid #ef9a9a; border-radius: 8px; padding: 1rem; white-space: pre-wrap; }
    ul { list-style: none; padding: 0; }
    li { margin: .5rem 0; }
    a.dl { display: inline-block; background: #1565c0; color: #fff; text-decoration: none; padding: .5rem .9rem; border-radius: 8px; }
    a.back { display: inline-block; margin-top: 1.5rem; color: #1565c0; }
  </style>
</head>
<body>
  <h1>채보 결과</h1>

  {% if error %}
    <p>채보에 실패했습니다. 필요한 도구가 설치되어 있는지 확인하세요.</p>
    <div class="error">{{ error }}</div>
  {% else %}
    <p>완료되었습니다. 아래에서 내려받으세요.</p>
    <ul>
      {% for label, name in files.items() %}
      <li><a class="dl" href="/download/{{ job }}/{{ name }}">{{ label }} 다운로드</a></li>
      {% endfor %}
    </ul>
  {% endif %}

  <a class="back" href="/">← 다른 파일 채보하기</a>
</body>
</html>

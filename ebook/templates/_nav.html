<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="/library"><svg class="logo" viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="5" width="5" height="15" rx="1"/><rect x="9" y="2" width="5" height="18" rx="1"/><rect x="16" y="7" width="4" height="13" rx="1"/></svg>PDF 서재</a>
    {% if in_library %}
    <form class="search" method="get" action="/library" role="search">
      <label class="sr" for="q">제목이나 저자로 찾기</label>
      <input id="q" name="q" type="search" value="{{ q }}" placeholder="제목, 저자 검색">
      <input type="hidden" name="sort" value="{{ sort }}">
    </form>
    {% else %}
    <a class="back" href="/library">← 서재로</a>
    {% endif %}
    <form class="whoami" method="post" action="/logout">
      <span class="avatar" aria-hidden="true">{{ user.username[:1]|upper }}</span><span>{{ user.username }}</span>
      <button class="link-btn" type="submit">로그아웃</button>
    </form>
  </div>
</header>

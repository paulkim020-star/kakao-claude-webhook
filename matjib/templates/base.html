<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진짜맛집 · 교차검증 맛집찾기</title>
<style>
  /* 프로토타입 룩: 화이트 + 토마토 레드 포인트, 모바일 우선 */
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         background: #f6f5f2; color: #29241f; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 14px 14px 40px; }

  header.app { display: flex; align-items: baseline; gap: 8px; padding: 10px 2px 14px; }
  header.app h1 { font-size: 22px; letter-spacing: -.5px; }
  header.app h1 a { color: #e8442e; }
  header.app .tag { font-size: 11.5px; color: #96908a; font-weight: 600; }

  .card { background: #fff; border-radius: 16px; padding: 16px;
          border: 1px solid #ece9e4; box-shadow: 0 1px 4px rgba(40,30,20,.05);
          margin-top: 12px; }
  .muted { color: #96908a; font-size: 12.5px; line-height: 1.6; }
  h2.sec { font-size: 14px; color: #6b645d; margin: 18px 2px 2px; letter-spacing: .5px; }

  /* 검색창 */
  .searchbar { display: flex; gap: 8px; }
  .searchbar input[type=text] { flex: 1; padding: 13px 15px; font-size: 15px;
         border: 1.5px solid #e3ded7; border-radius: 12px; background: #fff; }
  .searchbar input:focus { outline: none; border-color: #e8442e; }
  .searchbar button { padding: 0 18px; border: 0; border-radius: 12px; font-size: 15px;
         font-weight: 800; background: #e8442e; color: #fff; cursor: pointer; }

  /* 칩 (지역/카테고리) */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chips a, .chips button { padding: 8px 13px; border-radius: 999px; font-size: 13px;
         font-weight: 700; background: #fff; border: 1.5px solid #e3ded7; color: #57504a;
         cursor: pointer; }
  .chips a:hover, .chips button:hover { border-color: #e8442e; color: #e8442e; }
  .chips .on { background: #e8442e; border-color: #e8442e; color: #fff; }

  /* 결과 카드 */
  .shop { display: block; }
  .shop + .shop { margin-top: 10px; }
  .shop .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .shop .name { font-size: 16.5px; font-weight: 800; }
  .shop .meta { font-size: 12.5px; color: #96908a; margin-top: 3px; }
  .shop .total { text-align: right; flex-shrink: 0; }
  .shop .total b { font-size: 21px; color: #e8442e; }
  .shop .total span { display: block; font-size: 10.5px; color: #b5afa8; }
  .badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 8px;
           border-radius: 6px; margin-bottom: 6px; }
  .badge.g3 { background: #fff1e6; color: #c2410c; border: 1px solid #fed7aa; }
  .badge.g2 { background: #ecfdf3; color: #157347; border: 1px solid #bbe7cc; }
  .badge.g1 { background: #f3f1ee; color: #6b645d; border: 1px solid #e3ded7; }
  .statusline { font-size: 12.5px; margin-top: 8px; font-weight: 600; }

  /* 필터 바 */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filters select { padding: 8px 10px; border-radius: 10px; border: 1.5px solid #e3ded7;
           font-size: 13px; background: #fff; color: #57504a; }
  .filters label.ck { display: inline-flex; gap: 5px; align-items: center; font-size: 12.5px;
           font-weight: 700; color: #57504a; background: #fff; border: 1.5px solid #e3ded7;
           border-radius: 999px; padding: 8px 12px; cursor: pointer; }
  .filters button { padding: 8px 14px; border: 0; border-radius: 10px; font-size: 13px;
           font-weight: 800; background: #29241f; color: #fff; cursor: pointer; }

  /* 채널 점수 바 */
  .bar { display: grid; grid-template-columns: 62px 1fr 40px; gap: 10px; align-items: center;
         font-size: 12.5px; margin-top: 9px; }
  .bar .track { height: 8px; background: #f0ede8; border-radius: 99px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 99px; background: #e8442e; }
  .bar .fill.dim { background: #d4cec7; }
  .bar b { text-align: right; font-size: 12px; }

  .btn { display: block; text-align: center; padding: 13px; border-radius: 12px;
         font-size: 14.5px; font-weight: 800; background: #e8442e; color: #fff; margin-top: 10px; }
  .btn.secondary { background: #fff; color: #57504a; border: 1.5px solid #e3ded7; }
  .btn.secondary:hover { border-color: #e8442e; color: #e8442e; }

  .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0;
         font-size: 13.5px; border-bottom: 1px dashed #ece9e4; }
  .row:last-child { border-bottom: 0; }
  .row .k { color: #96908a; flex-shrink: 0; }

  .notice { background: #fffbea; border: 1px solid #f3e5ab; color: #8a6d1a;
            border-radius: 12px; padding: 13px 15px; font-size: 13px; line-height: 1.6;
            margin-top: 12px; }
  footer { text-align: center; padding: 26px 0 0; }
  footer .muted { font-size: 11.5px; }

  @media (min-width: 768px) { .wrap { max-width: 640px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <h1><a href="/matjib{% if t %}?t={{ t }}{% endif %}">진짜맛집</a></h1>
    <span class="tag">인스타 × 유튜브 × 블로그 교차검증</span>
  </header>
  {% block content %}{% endblock %}
  <footer>
    <p class="muted">프로토타입 v0.1 · 데이터는 목업(가상 상호)입니다<br>
    기준 시각 {{ now.strftime("%H:%M") }}{% if t %} (데모 시각 고정){% endif %}</p>
  </footer>
</div>
</body>
</html>
